server:
  port: ${PORT:8090}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/java_fullstack_v10?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:lab}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
logging:
  level:
    root: INFO
    com.aliyun.oss: OFF
    org.apache.http.wire: OFF
    org.apache.http.headers: OFF
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
