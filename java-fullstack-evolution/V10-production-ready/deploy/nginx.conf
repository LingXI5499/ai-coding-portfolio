# Replace domain, certificate and filesystem paths before nginx -t.
server {
    listen 80;
    server_name accounts.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name accounts.example.invalid;
    ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/evolution/frontend;
    index index.html;
    # multipart 请求上限；应用内还校验单张图片不超过 2 MiB。
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }

    location /actuator/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
