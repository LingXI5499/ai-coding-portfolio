<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>V01 · 员工工作台</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/">
          <span class="brand-mark">J</span>
          进化实验室
        </a>
        <small>JAVA FULL-STACK / V01</small>
        <nav class="nav"><a href="/">员工工作台</a></nav>
        <div class="sidebar-foot">
          从一次 HTTP 请求开始
          <br />
          让每一层职责清晰可见
        </div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <span>实验室 / 员工管理</span>
          <span class="badge">原生 JavaScript · Fetch</span>
        </header>
        <section class="intro">
          <div>
            <div class="eyebrow">EXPERIMENT 01 / EMPLOYEE WORKSPACE</div>
            <h1>从浏览器，走到数据库。</h1>
            <p>在一个小而完整的业务中，观察 HTTP、业务服务与 SQL 如何协作。</p>
          </div>
          <span class="badge">实体直出</span>
        </section>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="card">
          <div class="toolbar">
            <h2>员工名册</h2>
            <button id="reload">刷新列表</button>
          </div>
          <div id="employee-filters"></div>
          <div id="list" class="table-wrap"></div>
          <nav id="employee-pagination"></nav>
        </div>
        <section class="card">
          <h2 id="form-title">新增员工</h2>
          <form id="employee-form">
            <div class="form-grid">
              <label>
                姓名
                <input name="name" required maxlength="50" />
              </label>
              <label>
                性别
                <select name="gender">
                  <option>未说明</option>
                  <option>男</option>
                  <option>女</option>
                </select>
              </label>
              <label>
                年龄
                <input
                  name="age"
                  type="number"
                  min="18"
                  max="70"
                  value="25"
                  required
                />
              </label>
              <label>
                电话
                <input name="phone" maxlength="20" />
              </label>
              <label>
                部门
                <input name="department" required maxlength="100" />
              </label>
              <label>
                月薪
                <input
                  name="salary"
                  type="number"
                  min="0"
                  max="99999999.99"
                  step=".01"
                  value="8000"
                  required
                />
              </label>
            </div>
            <div class="actions">
              <button type="submit">保存员工</button>
              <button type="button" class="secondary" id="cancel">
                取消编辑
              </button>
            </div>
          </form>
        </section>
        <p class="caption">
          数据保存在当前版本的数据库中。此教学版本不包含登录，仅限本机学习。
        </p>
      </main>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
