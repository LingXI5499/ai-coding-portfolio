name: Java Full-Stack Evolution
on:
  push:
    paths: ['java-fullstack-evolution/**', '.github/workflows/java-fullstack-evolution.yml']
  pull_request:
    paths: ['java-fullstack-evolution/**', '.github/workflows/java-fullstack-evolution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: 'java-fullstack-evolution/*/frontend/package-lock.json'
      - name: Java and SQL structure checks
        shell: bash
        run: |
          set -euo pipefail
          node java-fullstack-evolution/scripts/check-structure.mjs
          test "$(find java-fullstack-evolution -maxdepth 1 -type d -name 'V[0-9][0-9]-*' | wc -l)" -eq 10
          if grep -REni 'FOREIGN[[:space:]]+KEY|REFERENCES[[:space:]]+[a-z_]' java-fullstack-evolution/*/backend/src/main/resources --include='*.sql'; then exit 1; fi
      - name: Backend verify on MySQL 8.4
        env:
          MYSQL_PWD: ci-ephemeral-only
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-ephemeral-only
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_INIT_SQL: "SET time_zone = '+00:00'"
        shell: bash
        run: |
          set -euo pipefail
          for project in java-fullstack-evolution/V*; do
            version=$(basename "$project" | cut -c2-3)
            database="java_fullstack_v${version}"
            mysql -h 127.0.0.1 -u root -e "CREATE DATABASE ${database} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            export TEST_DB_URL="jdbc:mysql://127.0.0.1:3306/${database}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
            (cd "$project/backend" && chmod +x mvnw && ./mvnw --batch-mode clean verify)
          done
      - name: Frontend test and build
        shell: bash
        run: |
          set -euo pipefail
          for frontend in java-fullstack-evolution/V*/frontend; do
            (cd "$frontend" && npm ci && npm test && npm run build)
          done
      - name: Browser workflows for all ten versions
        working-directory: java-fullstack-evolution/V10-production-ready/frontend
        env:
          SMOKE_MYSQL: 'true'
          DB_USERNAME: root
          DB_PASSWORD: ci-ephemeral-only
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: java-evolution-test-reports
          path: |
            java-fullstack-evolution/*/backend/target/surefire-reports/
            java-fullstack-evolution/V10-production-ready/frontend/test-results/
          retention-days: 7
